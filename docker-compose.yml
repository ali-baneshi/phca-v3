# PHCA — Docker Compose
#
#   docker compose run --rm test        run the pytest suite
#   docker compose run --rm ci-local    lint + tests + causal smoke
#   docker compose run --rm bash        interactive shell with MuJoCo

services:
  test:
    build:
      context: .
      target: phca-core
    entrypoint: ["make"]
    command: ["test-python"]
    environment:
      - MUJOCO_GL=disabled

  ci-local:
    build:
      context: .
      target: phca-core
    entrypoint: ["make"]
    command: ["ci-local"]
    environment:
      - MUJOCO_GL=disabled

  bash:
    build:
      context: .
      target: phca-mujoco
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true
    environment:
      - MUJOCO_GL=disabled

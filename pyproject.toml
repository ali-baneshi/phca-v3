[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phca"
version = "0.1.0"
description = "Predictive Hierarchical Cognitive Architecture research prototype"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "docs/license.md"}
authors = [
    {name = "PHCA contributors"},
]
dependencies = [
    "numpy==1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-mock>=3.12",
    "pytest-timeout==2.2.0",
    "ruff==0.2.0",
]
mujoco = [
    "gymnasium[mujoco]==1.0.0",
    "mujoco==3.2.7",
]
stats = [
    "scipy>=1.12",
]
graph = [
    "pgmpy==1.0.0",
]

[project.scripts]
phca = "phca.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["phca*"]
exclude = ["phca.*.tests", "phca.*.tests.*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["attic"]

[tool.ruff.lint.per-file-ignores]
"python/tests/test_continuous_actions.py" = ["E402"]
"python/tests/test_cycle_with_mujoco.py" = ["E402"]
"python/tests/test_mujoco_env.py" = ["E402"]

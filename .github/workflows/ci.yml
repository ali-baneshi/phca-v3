name: PHCA v3.0 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Verify editable package metadata
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          python -c "import phca; print(phca.__version__)"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make install-deps
      - name: Lint Python
        run: |
          ruff check python/ --no-cache

  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make install-deps
      - name: Verify optional dependency isolation
        env:
          PYTHONPATH: python
        run: |
          python - <<'PY'
          from phca.world_model.graph import WorldModelGPrime
          from phca.world_model.gaussian import conditional_covariance
          print("Gaussian graph import without optional pgmpy runtime: PASS")
          PY
      - name: Test Python
        env:
          MUJOCO_GL: disabled
        run: |
          PYTHONPATH=python:$PYTHONPATH python -m pytest python/tests/ python/phca/ \
            --ignore=python/tests/test_mujoco_env.py \
            --ignore=python/tests/test_cycle_with_mujoco.py \
            --ignore=python/tests/test_continuous_actions.py \
            -v --tb=short --timeout=30 --maxfail=5 --benchmark-skip

  observatory-check:
    runs-on: ubuntu-latest
    needs: [test-python]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make install-deps
      - name: Observatory session integrity gate
        run: |
          PYTHONPATH=python:$PYTHONPATH python scripts/phca_replay.py --check python/phca/monitoring/tests/fixtures/multi_agent_short/
          PYTHONPATH=python:$PYTHONPATH python scripts/phca_replay.py --check python/phca/monitoring/tests/fixtures/reacher_short/

  noise-injector:
    runs-on: ubuntu-latest
    needs: [test-python]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make install-deps
      - name: NoiseInjector unit tests
        run: |
          PYTHONPATH=python:$PYTHONPATH python -m pytest python/phca/asi/tests/ \
            -v --tb=short --maxfail=5

  # L0 smoke / regression floor only — NOT L2–L4 cognitive competence.
  # Nightly runs fuller static Φ-IQ + causal gates. See README CI table.
  benchmark-level-0:
    name: benchmark-level-0 (L0 smoke / Φ-IQ regression floor)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [test-python]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make install-deps
      - name: Run quick L0 benchmark (smoke only)
        run: |
          mkdir -p logs
          PYTHONPATH=python:$PYTHONPATH python scripts/benchmark.py --quick --output=logs/benchmark_report.json
      - name: Check Φ-IQ L0 regression floor
        run: |
          python scripts/check_benchmark_gate.py logs/benchmark_report.json logs/benchmark_ci_baseline.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-quick
          path: logs/benchmark_report.json

  mujoco-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-python]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make install-deps
          make install-mujoco-deps
      - name: MuJoCo CI gate (Pendulum + Cartpole + Reacher)
        env:
          MUJOCO_GL: disabled
        run: make mujoco-ci
      - name: Upload MuJoCo logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mujoco-logs
          path: logs/nightly_mujoco_*.json

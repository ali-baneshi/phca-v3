name: PHCA v3.0 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint Python
        run: |
          ruff check python/ --no-cache

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r requirements-mujoco.txt
      - name: Test Python
        env:
          MUJOCO_GL: disabled
        run: |
          PYTHONPATH=python:$PYTHONPATH python -m pytest python/tests/ python/phca/ \
            -v --tb=short --timeout=30 -x --benchmark-skip

  benchmark-level-0:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [test-python]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run quick benchmark
        run: |
          mkdir -p logs
          PYTHONPATH=python:$PYTHONPATH python scripts/benchmark.py --quick --output=logs/benchmark_report.json
      - name: Check Φ-IQ regression gate
        run: |
          python scripts/check_benchmark_gate.py logs/benchmark_report.json logs/benchmark_ci_baseline.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-quick
          path: logs/benchmark_report.json

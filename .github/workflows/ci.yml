name: PHCA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install (numpy only) and smoke the CLI
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -c "import phca; print(phca.__version__)"
          phca run --cycles 20 --seed 0 --quiet --out /tmp/r.json
          python -c "import json; d=json.load(open('/tmp/r.json')); assert d['schema']=='phca.result.v1'"
      - name: Wheel must not ship tests, attic, logs, docs, or monitoring
        run: |
          pip wheel . --no-deps -w /tmp/whl >/dev/null
          python - <<'PY'
          import glob, zipfile, sys
          names = zipfile.ZipFile(glob.glob('/tmp/whl/*.whl')[0]).namelist()
          bad = [n for n in names if '/tests/' in n or n.startswith(('attic/', 'logs/', 'docs/'))
                 or '/monitoring/' in n]
          if bad:
              print(f"unwanted wheel entries: {bad[:5]}", file=sys.stderr)
              sys.exit(1)
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          make install-deps
          ruff check python/ --no-cache

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make install-deps
      - name: Optional graph stack stays optional
        env:
          PYTHONPATH: python
        run: |
          python -c "from phca.world_model.graph import WorldModelGPrime; print('graph import without pgmpy: OK')"
      - name: Test
        env:
          MUJOCO_GL: disabled
        run: |
          PYTHONPATH=python:$PYTHONPATH python -m pytest python/tests/ python/phca/ \
            --ignore=python/tests/test_mujoco_env.py \
            --ignore=python/tests/test_cycle_with_mujoco.py \
            --ignore=python/tests/test_continuous_actions.py \
            -v --tb=short --timeout=60 --maxfail=5

  mujoco-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install with MuJoCo
        run: |
          python -m pip install --upgrade pip
          make install-deps
          make install-mujoco-deps
      - name: MuJoCo integration tests
        env:
          MUJOCO_GL: disabled
        run: make test-mujoco
      - name: Pendulum through the CLI
        env:
          MUJOCO_GL: disabled
        run: PYTHONPATH=python python -m phca run --env pendulum --cycles 20 --seed 0

  causal-smoke:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          make install-deps
          make causal-smoke

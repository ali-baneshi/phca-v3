name: PHCA nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  causal-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          make install-deps
      # Reporting, not gating: the geometry-dominated default is known not to
      # beat the baselines it is compared against. See audit/claims-vs-code.md.
      - name: Causal comparison report
        env:
          MUJOCO_GL: disabled
        run: |
          mkdir -p .tmp
          PYTHONPATH=python python scripts/phca_causal_eval.py \
            --levels level2 --cycles 200 --seeds 30 \
            --output .tmp/causal_nightly.json || true
      - name: Selector comparison
        env:
          MUJOCO_GL: disabled
        run: |
          PYTHONPATH=python python -m phca bench --sizes 5,10 --seeds 0,1,2 \
            --cycles 200 --relocate-goal-every 25 --out .tmp/bench.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-reports
          path: .tmp/*.json
